<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보고서 — 그룹온라인 IT</title>
<style>
  html,body{margin:0;height:100%;background:#0E1116}
  iframe{border:0;width:100%;height:100%;display:block;background:#fff}
  .msg{
    display:grid;place-items:center;height:100%;color:#9AA6B8;text-align:center;padding:24px;
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.75;
  }
  .msg b{display:block;color:#E9EDF4;font-size:18px;margin-bottom:8px}
</style>
</head>
<body>
<div class="msg" id="msg">보고서를 여는 중…</div>

<script>
// 공유 링크 전용 화면.
// Supabase 는 자기 주소에서 HTML 을 화면으로 안 띄우므로(피싱 방지 정책),
// 서명 링크의 내용을 받아 브라우저 안에서 HTML 로 되살려 보여준다.
// 로그인은 필요 없다. 링크의 서명 토큰 자체가 열쇠이며 Supabase 가 검증한다.

const msg = document.getElementById("msg");

function fail(title, detail){
  msg.innerHTML = `<div><b>${title}</b>${detail}</div>`;
}

(async () => {
  const u = new URLSearchParams(location.search).get("u");
  if (!u) return fail("잘못된 링크입니다.", "공유해 주신 분께 새 링크를 요청하세요.");

  // 이 프로젝트의 보고서 서명 링크만 연다
  if (!/^https:\/\/[a-z0-9]+\.supabase\.co\/storage\/v1\/object\/sign\/reports\//.test(u)) {
    return fail("잘못된 링크입니다.", "공유해 주신 분께 새 링크를 요청하세요.");
  }

  try {
    const r = await fetch(u);
    if (!r.ok) {
      return fail("링크가 만료되었습니다.",
        "공유 링크는 90일간 열립니다.<br>공유해 주신 분께 새 링크를 요청하세요.");
    }
    const body = await r.text();
    const blob = new Blob([body], { type: "text/html" });
    const frame = document.createElement("iframe");
    frame.src = URL.createObjectURL(blob);
    document.body.innerHTML = "";
    document.body.appendChild(frame);
  } catch (e) {
    fail("보고서를 열지 못했습니다.", "잠시 후 다시 시도해 주세요.");
  }
})();
</script>
</body>
</html>
